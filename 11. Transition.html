<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            align-items: center;
        }
        .wrap{
            width: 400px;
            height: 400px;
            text-align: center;
            align-content: center;
            font-size: 2rem;
            border: 3px solid black; 
            background-color: aqua;
            transition-property: background-color;
            transition-property: all;
            transition-duration: 1000ms;
            transition-timing-function: ease-in;
       }
       .wrap:hover{
        border-radius: 50%;
        background-color: aquamarine;
        align-content: center;
       }

       .box{
        width: 100%;
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        animation: rotate 5s ease-in infinite forwards;
        transition: all 1000ms ease-in-out;
       }
       @keyframes rotate{
        from{

        }
        to{
            transform: scale(-1.5);
        }
       }

    </style>
</head>
<body>
    <!-- ---------------- Hover ----------------- -->
    <div class="wrap"><strong>Kapil</strong></div>

    <div class="box">
        <img src="https://images.pexels.com/photos/4444815/pexels-photo-4444815.jpeg" alt="forest" height="500px" width="500px">
    </div>
</body>
</html>
