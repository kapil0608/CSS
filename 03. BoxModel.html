<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body{
            background-color: aquamarine;
        }
        h1{
            border: 2px solid red;
            height: 100px;
            width:auto;
            padding: 100px;
            padding-top: 150px;
            padding-left: 200px;
            padding-right: 200px;
            margin: 50px;
            border-top-left-radius: 50%;
            border-top-right-radius: 50%;
            border-top-color: black;
            border-bottom-color: white;
            border-left-color: red;
            border-right-color: yellow;
        }
        h2{
            border: 3px dotted purple;
            color:chartreuse ;
            height:100px;
            width: auto;
            border-radius: 10px 20px 30px 40px;
            padding:  150px 50px 100px 400px;
            margin: 50px;
        }
        h3{
            border: 3px;
            border-style:dashed ;
            border-color: blueviolet;
            height:100px;
            width: auto;
            border-radius: 10px 20px 30px 40px;
            padding:  150px 50px 100px 400px;
            margin: 50px;

        }

    </style>

</head>
<body>
    <h1>My Name is Kapil | Bhopal | Madhya Pradesh</h1>
    <h2>Delhi is the Capital of India </h2>
    <h3>Bengalore is the Capital of Karnataka</h3>
</body>
</html>
