<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            margin: 0;
        }
        .wrapper{
            width: 100%;
            height: 100vh;
            background-color: bisque;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .container{
            width: 85%;
            height: 85%;
            border: 3px solid white;
            background-color: coral;
            display: flex;
            gap: 20px;
        }
        .wrapper-2{
            width: 100%;
            height: 100vh;
            background-color: darkgrey;
        }
        .box{
            width: 200px;
            height: 180px;
            background-color: aqua;
            border: 2px solid rgb(255,255,255);
            display: flex;
            justify-content: center;
            font-size: 2.5rem;
            font-family: Georgia, 'Times New Roman', Times, serif;
            border-radius: 30%;
            box-shadow: 10px 10px 10px rgb(41,43,155) inset,
                        -10px -10px 10px rgb(41,43,155) inset;
        }
        .container>div:nth-child(1){
            position: static;
            top: 400px;
            left: 300px
        }
        .container>div:nth-child(2){
            position: relative;
            top: 250px;
            right: -300px
        }
        .container>div:nth-child(3){
            position: absolute;
            top: 300px
        }
        .container>div:nth-child(4){
            position: sticky;
            top: 40px;
        }
         .container>div:nth-child(5){
            position: fixed;
            top: 10px
        }

    </style>
</head>
<body>
    <div class="wrapper">
        <div class="container">
            <div class="box">Static</div>
            <div class="box">Relative</div>
            <div class="box">Absolute</div>
            <div class="box">Sticky</div>
            <div class="box">Fixed</div>
        </div>
    </div>
    <div class="wrapper-2"></div>
</body>
</html>
