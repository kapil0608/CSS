<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            margin:0px;
        }
        .main{
            height: 80vh;
            width: 100%;
            background-color: lightblue;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .ball{
            height: 50px;
            width: 50px;
            text-align: center;
            background-color: aqua;
            border-radius: 50%;
            animation: bounce 1000ms ease-in infinite alternate;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .main>div:nth-child(1){
            animation-delay: 50ms;
        }
        .main>div:nth-child(2){
            animation-delay: 100ms;
        }
        .main>div:nth-child(3){
            animation-delay: 150ms;
        }
        .main>div:nth-child(4){
            animation-delay: 200ms;
        }
         .main>div:nth-child(5){
            animation-delay: 250ms;
        }
        .main>div:nth-child(6){
            animation-delay: 300ms;
        }
        .main>div:nth-child(7){
            animation-delay: 350ms;
        }
         .main>div:nth-child(8){
            animation-delay: 400ms;
        }
        .main>div:nth-child(9){
            animation-delay: 450ms;
        }
        .main>div:nth-child(10){
            animation-delay: 500ms;
        }
        .main>div:nth-child(11){
            animation-delay: 550ms;
        }
        @keyframes bounce{
            from{
                transform: translateY(200px);
            }
            to{
                transform: translateY(-200px);
            }
        }
    </style>
</head>
<body>
    <div class="main">
        <div class="ball">K</div>
        <div class="ball">A</div>
        <div class="ball">P</div>
        <div class="ball">I</div>
        <div class="ball">L</div>
        <div class="ball">S</div>
        <div class="ball">H</div>
        <div class="ball">A</div>
        <div class="ball">R</div>
        <div class="ball">M</div>
        <div class="ball">A</div>

    </div>
</body>
</html>
