<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            margin:0px;
        }
        .main{
            height: 100vh;
            width: 100%;
            color: aliceblue;
            background-color: lightblue;
            display:  flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            gap : 25px;
        }
        .main>.sub-main{
            height: 50vh;
            width: 100%;
            background-color: rgb(61,59,56);
            display: flex;
            justify-content:  space-evenly;
            align-items: center;
        }
        .sub-main>.box{
            height: 200px;
            width:200px;
            display: flex;
            background: linear-gradient(25deg, aqua, magenta,green);
            justify-content:  center;
            align-items:  center;
            font-size: 2.5rem;
            box-shadow: 0px 0px 20px 10px rgba(0,0,0,0.59) inset;
            transition: all 500ms ease-in;
        }
        .sub-main>.box-1{
            height: 200px;
            width: 200px;
            background: wheat;
            display: flex;
            justify-content:  center;
            align-items:  center;
            font-size: 2.5rem;
            box-shadow: 0px 0px 20px 10px white inset;
            transition: all 500ms ease-in;
        }
        .sub-main>.box-2{
            height: 200px;
            width: 200px;
            
            display: flex;
            justify-content:  center;
            align-items:  center;
            font-size: 2.5rem;
            box-shadow: 0px 0px 20px 10px rgba(0,0,0,0.59) inset;
            transition: all 500ms ease-in;
        }
        /* ------------------- ROTATE ------------------- */
        .rotate>div:nth-child(1):hover{
            transform: rotateX(180deg);
        }
        .rotate>div:nth-child(2):hover{
            transform: rotateY(180deg);
        }
        .rotate>div:nth-child(3):hover{
            transform: rotateZ(180deg);
        }
        .rotate>div:nth-child(4):hover{
            transform: rotateX(180deg) rotateY(360deg) rotateZ(60deg);
        }
        /* .rotate > div:nth-child(4):hover {
             transform: rotate3d(1, 0, 0, 180deg);
        }
         */

         /* ------------------ SCALE ------------------- */
        .scale>div:nth-child(1):hover{
            transform: scaleX(1.3);
        }
        .scale>div:nth-child(2):hover{
            transform: scaleY(2);
        }
        .scale>div:nth-child(3):hover{
            transform: scale(-1.3);
        }
        .scale>div:nth-child(4):hover{
            transform: scaleX(1.3) scaleY(-1.3) scale(1.3);
        }

         /* --------------------- SKEW ---------------------- */

        .skew>div:nth-child(1):hover{
            transform: skewX(45deg);
        }
        .skew>div:nth-child(2):hover{
            transform: skewY(70deg);
        }
        .skew>div:nth-child(3):hover{
            transform: skew(45deg);
        }
        .skew>div:nth-child(4):hover{
            transform: skewX(70deg) skewY(45deg) skew(40deg);
        }
    </style>
</head>
<body>
    <div class="main">
        <h1>ROTATE</h1>
        <div class="sub-main rotate">
            <div class="box">A</div>
            <div class="box">B</div>
            <div class="box">C</div>
            <div class="box">A,B,C</div>
        </div>
        <h1>SCALE</h1>
        <div class="sub-main scale">
            <div class="box-1">X</div>
            <div class="box-1">Y</div>
            <div class="box-1">Z</div>
            <div class="box-1">X,Y,Z</div>
        </div>
        <h1 >SKEW</h1>
        <div class="sub-main skew">
            <div class="box-2">L</div>
            <div class="box-2">M</div>
            <div class="box-2">N</div>
            <div class="box-2">L,M,N</div>
        </div>
    </div>
</body>
</html>
