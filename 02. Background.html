<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body{
            background-color: aliceblue;
            background-image: url(https://images.pexels.com/photos/38086853/pexels-photo-38086853.jpeg);
            background-size: 170%;
            background-repeat: no-repeat;
            background-attachment: fixed;
        }
        h1,h2,h3,h4,h5,h6{
            font-size: 3rem;
            color:rgb(208, 42, 61);
            text-align: center;
        }
        h1{
            opacity: 0;
        }
        h2{
            opacity: 0.2;
        }
        h3{
            opacity: 0.4;
        }
        h4{
            opacity: 0.6;
        }
        h5{
            opacity: 0.8;
        }
        h6{
            opacity: 1;
        }

    </style>
</head>
<body>
    <h1>Hello World</h1>
    <h2>Hello World</h2>
    <h3>Hello World</h3>
    <h4>Hello World</h4>
    <h5>Hello World</h5>
    <h6>Hello World</h6>
</body>
</html>
