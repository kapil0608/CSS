<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        /*------------- ID Selector ----------------*/
        #header-1{
            font-size: 4.5rem;
            border: 3px dashed black;
        }

         /*------------- Class Selector ----------------*/

        .heading-2{
            font-size: 3rem;
            font-family: Arial, Helvetica, sans-serif;
            color: greenyellow;
            text-align: center;
        }

        /* ----------- Universal Selector -------------*/

        *{
            color: lightcoral;
            margin: 50px;

        }

        /* ----------- Attribute Selector -------------*/

        input[type='text']{
            background-color: rgb(230, 241, 230);
            width:400px;
            height:80px;
            border: 4px solid gold;
            border-radius: 30px;

        }

        
        
    </style>
</head>
<body>
    <h1 id="header-1"> Bhopal | Madhya pradesh | India</h1>
    <h1 class="heading-2">Bangalore | Karnataka | India</h1>
    <h1> Kapil </h1>
    <h1> Ajay </h1>
    <h1> Rahul </h1>

    <input type="text" name="" id=""> 
</body>
</html>
